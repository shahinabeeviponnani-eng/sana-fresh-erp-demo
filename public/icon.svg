<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#142142" />
      <stop offset="100%" stop-color="#0b1329" />
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="6" />

  <!-- Subtle dot grid -->
  <g fill="#1e293b" opacity="0.5">
    <circle cx="80"  cy="80"  r="3.5"/><circle cx="176" cy="80"  r="3.5"/><circle cx="272" cy="80"  r="3.5"/><circle cx="368" cy="80"  r="3.5"/><circle cx="432" cy="80"  r="3.5"/>
    <circle cx="80"  cy="176" r="3.5"/><circle cx="432" cy="176" r="3.5"/>
    <circle cx="80"  cy="336" r="3.5"/><circle cx="432" cy="336" r="3.5"/>
    <circle cx="80"  cy="432" r="3.5"/><circle cx="176" cy="432" r="3.5"/><circle cx="272" cy="432" r="3.5"/><circle cx="368" cy="432" r="3.5"/><circle cx="432" cy="432" r="3.5"/>
  </g>

  <!-- "S" curve — clean, proportional stroke -->
  <path d="M 320 148
             C 230 118, 158 182, 178 264
             C 190 310, 234 334, 282 344
             C 328 354, 348 386, 332 414
             C 312 444, 256 450, 204 428"
        fill="none"
        stroke="url(#leafGrad)"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Leaf sprout at top of S — separated cleanly from stroke start -->
  <path d="M 320 148 C 374 108, 418 152, 388 208 C 352 196, 316 164, 320 148 Z"
        fill="url(#leafGrad)" />

  <!-- Small gold berry on leaf -->
  <circle cx="388" cy="162" r="11" fill="url(#goldAccent)" />
</svg>
